
#default 
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

#Фактор репликации и сжатия
replication_factor = 1 # Required to set same in all nodes for cluster mode
compression_level = 15 # Recommended 1-19, extreme 20-22

#настройка портов и линков
rpc_bind_addr = "[::]:3901"             #Garage cluster traffic between nodes
rpc_public_addr = "localhost:3901" # Required
rpc_secret = "6eaf26527166a8f03eeca33833a5a3a63c677d2bef842dcb407b61786e2d6911"   #openssl rand -hex 32

[s3_api] # Required
s3_region = "garage"
api_bind_addr = "[::]:3900"          #S3 traffic to clients
root_domain = ".s3.domain.com"

[s3_web] # Optional, if you want to expose bucket as web
bind_addr = "[::]:3902"     #S3 web traffic
#root_domain = ".web.domain.com"
root_domain = ".localhost"
index = "index.html"

[admin] # Required
api_bind_addr = "[::]:3903"   #Garage admin API
admin_token = "b82UnkHMydIaFfPlw1UWLBXHjrw6GrKLzlr7Zs98LsU="   #openssl rand -base64 32
metrics_require_token = true
metrics_token = "WX4bJ4U3mRB9Ey1HWzTlxAF3STWffr628DxU8StU3lw="   #openssl rand -base64 32

